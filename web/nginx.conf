# Serves the built app and forwards /api to the backend: one origin, so the SameSite=Strict
# refresh cookie works and no CORS is needed.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Scripts only from this origin. Styles allow 'unsafe-inline' because the toast library injects
    # a <style> element at runtime; there are no inline scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed file names never change, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
