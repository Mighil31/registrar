name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit and Testcontainers tests, coverage gate and formatting check.
      - name: Build and test
        run: mvn -B verify
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      # Written by OpenApiIT; the web job checks its TypeScript types still match.
      - name: OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/target/openapi.json

  web:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The committed API types must match the backend's current OpenAPI document.
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend/target
      - name: API types up to date
        run: npm run api && git diff --exit-code src/api/schema.ts
      # Type check (against the committed API types), unit tests, production build.
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
